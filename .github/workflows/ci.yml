name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: node --check server.js
      - run: node --check app.js
      - run: node --check curriculum.js
      - run: node --check supabase-auth-v2.js
      - run: node --check supabase-sync.js
      - run: node --check supabase-recovery.js
      - run: node --check supabase-config.js
      - run: node --check admin-ui.js
      - run: node --check certificate-ui.js
      - run: node scripts/validate-room-content.js
      - run: node tests/quiz-types.test.js
