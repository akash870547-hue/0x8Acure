name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/0x8acure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --check server.js
      - run: node --check app.js
      - run: node --check curriculum.js
      - run: node --check supabase-auth-v2.js
      - run: node --check supabase-sync.js
      - run: node --check supabase-recovery.js
      - run: node --check supabase-config.js
      - run: node --check admin-ui.js
      - run: node --check certificate-ui.js
      - run: node scripts/validate-room-content.js
      - run: node tests/quiz-types.test.js
