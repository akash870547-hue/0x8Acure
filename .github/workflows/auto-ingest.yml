name: Auto Ingest Drive Curriculum

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auto-ingest
  cancel-in-progress: true

jobs:
  ingest-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ingestion dependencies
        run: python -m pip install --upgrade pip gdown pymupdf

      - name: Run autonomous Drive ingestion
        run: python scripts/auto_drive_pipeline.py

      - name: Validate TypeScript and production build
        run: npm ci && npm run typecheck && npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/0x8acure
          VITE_API_BASE_URL: ${{ vars.CYBER_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Commit generated curriculum
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/modulesData.js data/quizData.json knowledge
          if git diff --cached --quiet; then
            echo "No ingestion changes to commit."
          else
            git commit -m "feat: auto-ingest drive materials and update quiz bank"
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble public website
        run: |
          mkdir -p _site/content
          cp index.html styles.css app.js command-palette.js curriculum.js rooms.js act-reference.js rules-reference.js api-client.js supabase-config.js supabase-auth-v2.js supabase-sync.js supabase-recovery.js admin-ui.js certificate-ui.js badge-ui.js 404.html og-preview.png _site/
          cp content/sources.json content/learning-paths.json _site/content/
          cp -R public/app _site/app
          node -e 'require("fs").writeFileSync("_site/public-config.js", "window.DPDP_API_BASE = " + JSON.stringify(process.env.CYBER_API_BASE_URL || "") + ";")'
        env:
          CYBER_API_BASE_URL: ${{ vars.CYBER_API_BASE_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
